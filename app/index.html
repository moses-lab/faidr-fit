<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAIDR-Fit</title>
<style>
  html { scrollbar-gutter: stable; }
  /* Palette from the dataviz reference, validated on both surfaces.
     Diverging poles: enriched = red (--pos), depleted = blue (--neg). */
  :root {
    --surface: #fcfcfb; --panel: #f4f3f0; --border: #e0dfdb;
    --ink: #0b0b0b; --ink-2: #52514e; --axis: #d5d4d0;
    --pos: #e34948; --neg: #2a78d6; --accent: #256abf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --panel: #242422; --border: #383835;
      --ink: #ffffff; --ink-2: #c3c2b7; --axis: #383835;
      --pos: #e66767; --neg: #3987e5; --accent: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 20px 64px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--ink-2); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  /* Marks the transition from inputs to fit-derived output; also the target
     of the greyed-out "computing" state while a fit is running. */
  #results-heading { font-size: 0.75rem; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--ink-2); margin: 4px 0 12px;
    padding-top: 14px; border-top: 1px solid var(--border); }
  .computing { opacity: 0.45; pointer-events: none; transition: opacity 0.15s ease; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .sub-count { color: var(--ink-2); font-size: 13px; margin: 0 0 14px;
    min-height: 1lh; }
  .input-grid { display: flex; gap: 16px; flex-wrap: wrap; }
  .input-grid textarea { flex: 1 1 320px; min-width: 240px; }
  .input-helpers { flex: 0 0 200px; min-width: 180px; display: flex;
    flex-direction: column; gap: 16px; }
  .input-helpers label { font-size: 13px; font-weight: 600; color: var(--ink-2);
    margin-bottom: 4px; }
  textarea { width: 100%; min-height: 96px; resize: vertical; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
    color: var(--ink); font: 13px/1.4 ui-monospace, monospace; }
  select { width: 100%; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; }
  input[type=number] { width: 68px; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit;
    -moz-appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px;
    cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { border-color: var(--border); color: var(--ink); }
  .step { padding: 6px 10px; font-weight: 600; line-height: 1; }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .readout { color: var(--ink-2); font-size: 13px; margin-top: 8px; }
  .readout b { color: var(--ink); font-variant-numeric: tabular-nums; }
  #feature-count { cursor: text; border-bottom: 1px dashed var(--axis); outline: none; }
  #feature-count:hover { border-bottom-color: var(--ink-2); }
  #feature-count:focus { border-bottom-color: var(--accent); }
  #status { color: var(--ink-2); font-size: 13px; margin: 14px 0 14px; min-height: 1.4em; }
  #predict-status { color: var(--ink-2); font-size: 13px; margin: 0; min-height: 1.4em; }
  .predict-summary { justify-content: space-between; margin: 8px 0 0; }
  .stack { display: flex; flex-direction: column; gap: 4px; }
  .stack p { margin: 0; }
  .metrics-row { display: flex; column-gap: 28px; row-gap: 4px; flex-wrap: wrap; }
  #chart { margin: 8px auto 0; max-width: 860px; overflow-x: auto; }
  #chart svg { display: block; }
  #chart .feat { fill: var(--ink); font-size: 12px; }
  #chart .val  { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  #chart .pos  { fill: var(--pos); }
  #chart .neg  { fill: var(--neg); }
  #chart .axis { stroke: var(--axis); stroke-width: 1; }
  #chart .empty { color: var(--ink-2); }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin: 4px 0 12px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px;
    border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .legend .p::before { background: var(--pos); }
  .legend .n::before { background: var(--neg); }
  .link-btn { background: none; border: none; padding: 0; margin: 0;
    font: inherit; font-weight: 600; color: var(--accent); cursor: pointer; }
  .link-btn:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>FAIDR-Fit</h1>
  <p class="sub">Explore the molecular features and function of intrinsically disordered regions (IDRs) across the human proteome in your browser</p>

  <div class="panel" id="main-panel">
    <label for="positives">Define function by specifying any group of related proteins or IDRs</label>
    <p class="sub-count" id="input-count"></p>

    <div class="input-grid">
      <textarea id="positives" placeholder="Q5VUJ6&#10;P07305_IDR_1_97&#10;..."></textarea>
      <div class="input-helpers">
        <div id="go-row">
          <label for="go-select">Or choose a predefined group</label>
          <select id="go-select"><option value="">— choose a group —</option></select>
        </div>
        <div id="random-row">
          <label for="random-size">Or randomize a number of IDRs</label>
          <div class="row">
            <input id="random-size" type="number" min="1" value="200">
            <button id="randomize-btn" type="button">Randomize</button>
          </div>
        </div>
      </div>
    </div>
    <p id="status"></p>

    <div id="results-body">
      <h2 id="results-heading">Results</h2>

      <label for="features">Number of molecular features</label>
      <div class="row">
        <button id="feat-dec" class="step" type="button" aria-label="Fewer features">−</button>
        <input id="features" type="range" min="0" max="0" value="0" step="1">
        <button id="feat-inc" class="step" type="button" aria-label="More features">+</button>
      </div>
      <p class="readout"><b id="feature-count" contenteditable="true" spellcheck="false" title="Click to type an exact feature count">0</b> molecular features selected</p>

      <div class="row predict-summary">
        <div class="stack">
          <p class="readout metrics-row">
            <span id="predict-recall">Recall: —</span>
            <span id="predict-precision">Precision (Enrichment): —</span>
          </p>
          <p id="predict-status"></p>
        </div>
        <button id="download-tsv" type="button" disabled>Download predictions (.tsv)</button>
      </div>
    </div>
  </div>

  <div class="legend">
    <span class="p">enriched (+z)</span>
    <span class="n">depleted (−z)</span>
  </div>
  <div id="chart"></div>
</main>

<script type="module">
  import { loadFromFiles, loadGoFromFiles } from "./proteome.js";
  import { startApp } from "./ui.js";
  const status = document.getElementById("status");
  status.textContent = "Loading proteome…";
  try {
    const proteome = await loadFromFiles(".");
    let go = null;
    try { go = await loadGoFromFiles("."); } catch { /* GO sets optional */ }
    startApp(proteome, go);
  } catch (e) {
    status.textContent = "Failed to load data — run `node app/prep-data.js` first, and serve over http.";
    console.error(e);
  }
</script>
</body>
</html>
